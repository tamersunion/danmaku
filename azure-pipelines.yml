trigger:
  - master
  - releases/*

pool:
  vmImage: ubuntu-latest

variables:
  version: 2.0.1

steps:
  - checkout: self
    fetchDepth: 1

  - task: GoTool@0
    inputs:
      version: 1.25.0

  - task: NodeTool@0
    inputs:
      versionSpec: 12.x

  - script: |
      go test ./...
      go vet ./...
    displayName: Test Go backend

  - script: |
      cd frontend
      npm ci
      npm run build
    displayName: Build Vue frontend

  - script: |
      mkdir -p "$(Build.ArtifactStagingDirectory)/linux-amd64/wwwroot"
      CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w -X main.version=$(version)" -o "$(Build.ArtifactStagingDirectory)/linux-amd64/danmaku" ./cmd/danmaku
      cp -R wwwroot/. "$(Build.ArtifactStagingDirectory)/linux-amd64/wwwroot/"
      cp appsettings.yml "$(Build.ArtifactStagingDirectory)/linux-amd64/"
    displayName: Build Linux artifact

  - task: PublishBuildArtifacts@1
    inputs:
      PathtoPublish: $(Build.ArtifactStagingDirectory)/linux-amd64
      ArtifactName: danmaku-linux-amd64
